name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore DrillApi.sln

      - name: Build solution
        run: dotnet build DrillApi.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DrillApi.sln --no-build --configuration Release --verbosity normal